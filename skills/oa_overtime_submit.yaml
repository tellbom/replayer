# v2.0 C16：技能起点恒为「已通过 entry 进入目标系统、会话已建立」。
# 登录环节在 entries/oa.yaml（载体职责），本技能不含任何登录步骤。
skill:
  id: oa_overtime_submit
  name: 提交加班申请
  description: Mock OA 加班申请确定性回放技能
  system: mock-oa
  baseUrl: http://127.0.0.1:15173
  entry: oa
  version: 2
params:
  - name: type
    type: enum
    values:
      - { label: 工作日加班, value: workday }
      - { label: 周末加班, value: weekend }
      - { label: 节假日加班, value: holiday }
    required: true
  - { name: startTime, type: datetime, required: true }
  - { name: endTime, type: datetime, required: true }
  - { name: reason, type: string, required: true }
preflight: []
steps:
  - id: csrf
    desc: 获取 CSRF token
    channel: network
    riskLevel: read
    hasSideEffect: false
    idempotent: true
    network:
      method: GET
      url: /api/csrf?_nodelay=1
      contentType: json
      extract: { csrfToken: $.token }
  - id: approver
    desc: 获取动态审批人与 approvalToken
    channel: network
    riskLevel: read
    hasSideEffect: false
    idempotent: true
    network:
      method: POST
      url: /api/overtime/approver?_nodelay=1
      contentType: json
      body: { type: '{{type|enumValue}}' }
      extract: { approverId: $.approverId, approvalToken: $.approvalToken }
  - id: startTime
    desc: 合并开始时间参数
    channel: merged
    riskLevel: read
    hasSideEffect: false
    idempotent: true
    ui: { action: setDateTime, value: '{{startTime}}' }
  - id: endTime
    desc: 合并结束时间参数
    channel: merged
    riskLevel: read
    hasSideEffect: false
    idempotent: true
    ui: { action: setDateTime, value: '{{endTime}}' }
  - id: reason
    desc: 合并事由参数
    channel: merged
    riskLevel: read
    hasSideEffect: false
    idempotent: true
    ui: { action: fill, value: '{{reason}}' }
  - id: submit
    desc: 提交加班申请
    channel: network
    riskLevel: write
    hasSideEffect: true
    network:
      method: POST
      url: /api/overtime/submit
      headers: { x-csrf-token: '{{csrf.csrfToken}}' }
      contentType: json
      body:
        type: '{{type|enumValue}}'
        startTime: '{{startTime}}'
        endTime: '{{endTime}}'
        reason: '{{reason}}'
        approverId: '{{approver.approverId}}'
        approvalToken: '{{approver.approvalToken}}'
assertions:
  - { type: httpStatus, expect: 200 }
  - { type: jsonPath, path: $.code, expect: 0 }
postcondition:
  request: { method: GET, url: /api/overtime/history?limit=5&order=desc }
  match:
    jsonPath: $.list[*]
    where: { reason: '{{reason}}', startTime: '{{startTime}}' }
    limit: 5
  expectFound: true
  timeoutMs: 10000
reentry:
  strategy: restart-from-anchor
  identityLock: true
  anchor: approver
  maxReentries: 2

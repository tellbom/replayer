skill:
  id: oa_overtime_submit
  name: 提交加班申请
  description: Mock OA 加班申请确定性回放技能
  system: mock-oa
  baseUrl: http://127.0.0.1:5173/login
  version: 1
params:
  - name: type
    type: enum
    values:
      - { label: 工作日加班, value: workday }
      - { label: 周末加班, value: weekend }
      - { label: 节假日加班, value: holiday }
    required: true
  - { name: startTime, type: datetime, required: true }
  - { name: endTime, type: datetime, required: true }
  - { name: reason, type: string, required: true }
preflight: []
steps:
  - id: login-user
    desc: 输入 Mock 用户名
    channel: ui
    riskLevel: read
    hasSideEffect: false
    ui:
      action: fill
      label: 用户名
      kind: input
      value: tester
      preAction:
        action: waitFor
        waitFor: { selector: .el-form-item }
  - id: login-password
    desc: 输入 Mock 密码
    channel: ui
    riskLevel: read
    hasSideEffect: false
    ui: { action: fill, label: 密码, kind: input, value: tester }
  - id: login-submit
    desc: 登录 Mock OA
    channel: ui
    riskLevel: read
    hasSideEffect: false
    ui:
      action: click
      target: { strategy: text, text: 登录 }
      waitFor: { selector: 'a[href="/overtime/apply"]' }
  - id: csrf
    desc: 获取 CSRF token
    channel: network
    riskLevel: read
    hasSideEffect: false
    network:
      method: GET
      url: /api/csrf
      contentType: json
      extract: { csrfToken: $.token }
  - id: approver
    desc: 获取动态审批人与 approvalToken
    channel: network
    riskLevel: read
    hasSideEffect: false
    network:
      method: POST
      url: /api/overtime/approver
      contentType: json
      body: { type: '{{type|enumValue}}' }
      extract: { approverId: $.approverId, approvalToken: $.approvalToken }
  - id: startTime
    desc: 合并开始时间参数
    channel: merged
    riskLevel: read
    hasSideEffect: false
    ui: { action: setDateTime, value: '{{startTime}}' }
  - id: endTime
    desc: 合并结束时间参数
    channel: merged
    riskLevel: read
    hasSideEffect: false
    ui: { action: setDateTime, value: '{{endTime}}' }
  - id: reason
    desc: 合并事由参数
    channel: merged
    riskLevel: read
    hasSideEffect: false
    ui: { action: fill, value: '{{reason}}' }
  - id: submit
    desc: 提交加班申请
    channel: network
    riskLevel: write
    hasSideEffect: true
    network:
      method: POST
      url: /api/overtime/submit
      headers: { x-csrf-token: '{{csrf.csrfToken}}' }
      contentType: json
      body:
        type: '{{type|enumValue}}'
        startTime: '{{startTime}}'
        endTime: '{{endTime}}'
        reason: '{{reason}}'
        approverId: '{{approver.approverId}}'
        approvalToken: '{{approver.approvalToken}}'
assertions:
  - { type: httpStatus, expect: 200 }
  - { type: jsonPath, path: $.code, expect: 0 }
postcondition:
  request: { method: GET, url: /api/overtime/history?limit=5&order=desc }
  match:
    jsonPath: $.list[*]
    where: { reason: '{{reason}}', startTime: '{{startTime}}' }
    limit: 5
  expectFound: true
  timeoutMs: 10000
